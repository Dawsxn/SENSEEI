# The demo's tutoring sessions, written out in full.
#
# Written for this repository in the style of real sessions: short first tries,
# the usual misses (a definition that covers one half of the concept, an example
# lifted from the reading, no non-example), and tutor replies that follow the
# dialogue moves the Orchestrator would choose. No participant's words are used.
#
# Each try lists the criteria it failed, with the Assessment Agent's reason, and
# the tutor's reply. A try with no `fail` passed. A session's status follows from
# its tries: four steps passed is complete, five failed tries on a step is a
# fallback, and `end: left` is a student who left partway through.
#
# `student` is an index into STUDENTS in scripts/seed.py. Sessions on a reading
# the seed could not load (the trial reading, when its local files are absent)
# are skipped.

sessions:
  # --- Dawson: a clean pass with one stumble ---------------------------------
  - student: 0
    reading: strategic_offensives
    days_ago: 6
    at: "14:05"
    steps:
      - step: State
        prompt: >-
          Let's start with State. In one or two sentences and in your own words,
          what is a strategic offensive?
        tries:
          - answer: A strategic offensive is when a company attacks its competitors to get more market share.
            fail:
              Completeness: >-
                It names only one reason to go on the offensive, gaining market
                share. It leaves out whittling away at a strong rival's advantage,
                and that the attack should be built on the company's own strengths.
            reply: >-
                You have the core idea that an offensive is an attack on rivals to
                win share. What's missing is the other half: when else a company
                would go on the offensive, and what the attack should be built on.
                Try stating it again with both of those in.
          - answer: >-
              It's when a company deliberately goes after rivals, either to take
              profitable market share from them or to weaken a strong rival's edge,
              using what the company is already good at against where rivals are weak.
            reply: >-
              That covers both parts: why a company attacks, and what it attacks
              with. Next, let's go deeper with Elaborate.
      - step: Elaborate
        prompt: >-
          Now Elaborate. Explain strategic offensives in more detail, as if to a
          classmate who missed the reading. Why go on the offensive, and what makes
          one likely to work?
        tries:
          - answer: >-
              A company doesn't always just defend its position. Sometimes it sees a
              chance to grow by winning customers away from competitors, as long as
              that growth is profitable and not just buying share at a loss. Other
              times a rival is so far ahead that the company has to chip away at
              that rival's advantage or it will keep falling behind. Either way the
              offensive only makes sense if it plays to the company's strengths, like
              lower costs or better R&D, and hits rivals where they're weak. If you
              attack with something you're not good at, you're likely to lose.
            reply: >-
              Clear and complete. You explained both triggers for an offensive and
              why it has to rest on the company's own strengths. On to Exemplify.
      - step: Exemplify
        prompt: >-
          Exemplify: give an example of a strategic offensive that isn't from the
          reading, explain why it counts, and give one thing that is not a
          strategic offensive.
        tries:
          - answer: >-
              A milk tea chain that already buys its tapioca and tea leaves in bulk
              much cheaper than the small shops around it could open branches next
              to those shops and sell the same drinks for less. That's an offensive
              because it's taking customers from rivals, and it's based on its cost
              advantage, which the small shops can't match. A non-example would be
              the same chain renovating its stores just to keep its regulars. That
              protects what it has instead of attacking anyone.
            reply: >-
              A good original example, and you tied it back to both parts: taking
              share from rivals and building on a cost advantage. The renovation is
              a clear non-example. Last step, Illustrate.
      - step: Illustrate
        prompt: >-
          Illustrate: compare a strategic offensive to something outside business,
          an analogy or metaphor that captures how it works.
        tries:
          - answer: >-
              It's like a basketball team with really fast guards choosing to push
              the ball on fast breaks every time the other team's big men are slow
              to get back. You attack with what you do best, at the exact spot where
              the other team is weakest.
            reply: >-
              That analogy holds up: the team's speed is the strength, the slow
              defenders are the weakness, and the attack is aimed right there. You
              have passed all four steps.

