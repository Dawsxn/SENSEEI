  # --- Dawson: Recovery to the Bisector, answering from the figures ----------
  - student: 0
    reading: tennis_recovery
    days_ago: 2
    at: "16:50"
    steps:
      - step: State
        prompt: >-
          Let's start with State. In one or two sentences and in your own words,
          what does recovering to the bisector mean?
        tries:
          - answer: >-
              After you hit, you move to the line that splits the opponent's
              possible shots in half, not to the middle of the court, and that line
              changes every time the ball moves.
            reply: >-
              Both parts are there: the bisector, not the centre, and it moves with
              the ball. On to Elaborate.
      - step: Elaborate
        prompt: >-
          Now Elaborate. Explain recovering to the bisector in more detail. Why is
          that the right place to stand, and why does it keep changing?
        tries:
          - answer: >-
              The opponent can hit anywhere between a down-the-line shot and the
              sharpest cross-court angle. If you go back to the centre mark you might
              be close to one of those and far from the other. In Figure 2 the
              runs from the centre mark are 4.2 m and 6.9 m, but from the bisector
              they're 5.2 m and 6.3 m, so the longest run gets shorter even though
              the short one gets a bit longer. That's what matters, because the shot
              you can't reach is the far one. And since the angles come from where
              the ball is, every new ball gives a new bisector.
            reply: >-
              Using the distances from Figure 2 makes the trade-off very clear: a
              shorter longest run is the point. On to Exemplify.
      - step: Exemplify
        prompt: >-
          Exemplify: give a situation that shows recovering to the bisector, explain
          why it fits, and give one that does not.
        tries:
          - answer: >-
              In badminton doubles, if I lift the shuttle deep to my opponent's
              backhand corner, I shouldn't go back to the exact middle. I should
              shift toward the side their cross-court reply would go, since that's
              the shot that would be furthest from me. A non-example is a player who
              always runs back to the centre mark after every shot, no matter where
              the ball went.
            reply: >-
              Taking it into badminton shows you understand the idea beyond tennis,
              and the non-example is exactly the habit the reading warns about. Last
              step, Illustrate.
      - step: Illustrate
        prompt: >-
          Illustrate: compare recovering to the bisector to something outside
          tennis, an analogy or picture that captures it.
        tries:
          - answer: >-
              It's like a goalkeeper facing a penalty kick from an angle. They don't
              stand in the middle of the goal, they stand on the line from the ball
              that splits the gap between the two posts, so neither post is too far
              to dive to. If the ball is placed somewhere else, the spot changes.
            reply: >-
              A great picture: the posts mark the two extremes and the keeper stands
              on the line between them. You have passed all four steps.

