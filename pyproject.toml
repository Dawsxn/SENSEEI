[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senseei"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

# Install only the provider you actually use:
#   pip install -e ".[gemini]"   provider: gemini (default) — supports thinking_level
#   pip install -e ".[openai]"   provider: openai_compat (Groq / OpenRouter / Together / Ollama / OpenAI)
[project.optional-dependencies]
gemini = ["google-genai>=2.9.0"]
openai = ["openai>=1.40.0"]
# The web app. Not needed to run the eval or the session harness.
backend = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "authlib>=1.3",          # Google OAuth client
  "itsdangerous>=2.2",     # signs the session cookie (Starlette SessionMiddleware)
  "httpx>=0.28",           # Authlib's OAuth client uses it at runtime
  "python-multipart>=0.0.18",  # reading uploads arrive as multipart forms
  "pdfminer.six>=20240706",    # a reading's text, with the layout to rebuild paragraphs
]
dev = [
  "pytest>=8.3",
  "pypdf>=5.0",            # builds small PDFs for the upload tests
  "anyio>=4.6",
  "httpx>=0.28",
]

[tool.setuptools]
packages = ["agents", "agents.providers", "backend"]

[tool.setuptools.package-data]
agents = ["prompts/*.md", "rubrics/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
