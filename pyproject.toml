[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senseei"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

# Install only the provider you actually use:
#   pip install -e ".[gemini]"   provider: gemini (default) — supports thinking_level
#   pip install -e ".[openai]"   provider: openai_compat (Groq / OpenRouter / Together / Ollama / OpenAI)
#   pip install -e ".[study]"    the human-evaluation harness in study/
[project.optional-dependencies]
gemini = ["google-genai>=2.9.0"]
openai = ["openai>=1.40.0"]
study = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools]
packages = ["agents", "agents.providers", "study"]

[tool.setuptools.package-data]
agents = ["prompts/*.md", "rubrics/*.yaml"]
