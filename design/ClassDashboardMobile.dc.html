<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .tab { font-size: 14px; font-weight: 500; color: #71717a; height: 48px; display: flex; align-items: center; border-bottom: 2px solid transparent; box-sizing: border-box; }
    .tab-on { color: #09090b; border-bottom-color: #09090b; }
    .btn { border-radius: 6px; font-family: inherit; font-weight: 500; cursor: pointer; }
    .btn-accent { border: 1px solid #bbf7d0; background: #f0fdf4; color: #15803d; }
    .btn-primary { border: none; background: {{primary}}; color: #ffffff; }
    .card { border: 1px solid #e4e4e7; border-radius: 8px; overflow: hidden; }
    .card-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #e4e4e7; }
    .card-title { font-size: 14px; font-weight: 600; }
    .muted { font-size: 13px; color: #71717a; }
    .stat-row { display: grid; grid-template-columns: 74px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; }
    .track { display: block; height: 6px; border-radius: 999px; background: #f4f4f5; overflow: hidden; }
    .fill { display: block; height: 100%; border-radius: 999px; background: {{primary}}; }
    .step { width: 20px; height: 4px; border-radius: 2px; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #ffffff; color: #09090b; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex-shrink: 0; border-bottom: 1px solid #e4e4e7;">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 100 100" fill="{{primary}}">
          <path d="M32 26 C42 23 58 23 68 26 C58 29 42 29 32 26 Z"></path>
          <path d="M50 70 C38 56 25 46 8 40 C10 42 11 44 12 46 C27 53 40 60 50 78 Z"></path>
          <path d="M50 70 C62 56 75 46 92 40 C90 42 89 44 88 46 C73 53 60 60 50 78 Z"></path>
          <path d="M47 66 C49 64 51 64 53 66 C52 74 51 79 50 86 C49 79 48 74 47 66 Z"></path>
        </svg>
        <span style="font-size: 14px; font-weight: 600;">SEN<span style="color: {{primary}};">SEE-I</span></span>
      </div>
      <div style="width: 28px; height: 28px; border-radius: 999px; background: #f4f4f5; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #71717a;">PR</div>
    </div>
    <div style="display: flex; gap: 24px; padding: 0 16px;">
      <span class="tab tab-on">Classes</span>
      <span class="tab">Readings</span>
    </div>
  </div>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      <span class="muted">{{backLabel}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 3px;">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">{{title}}</h1>
      <span style="font-size: 14px; color: #71717a; display: {{subtitleDisplay}};">{{subtitle}}</span>
    </div>

    <!-- The three statistics stack on a phone, one card under the other. -->
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-size: 16px; font-weight: 600;">Statistics</span>
      <span title="{{scope}}" style="display: flex; cursor: help;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title" style="display: flex; align-items: center; gap: 6px;">Pass rate by step<span title="Share of attempts that passed each step." style="display: flex; cursor: help;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span></span></div>
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{passRates}}" as="p" hint-placeholder-count="4">
          <div class="stat-row">
            <span style="color: #3f3f46;">{{p.step}}</span>
            <span class="track"><span class="fill" style="width: {{p.pct}}%;"></span></span>
            <span style="text-align: right; color: #71717a;">{{p.pct}}%</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title" style="display: flex; align-items: center; gap: 6px;">Most-failed criteria<span title="Criteria that failed most often." style="display: flex; cursor: help;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span></span></div>
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{criteria}}" as="c" hint-placeholder-count="3">
          <div style="display: flex; justify-content: space-between; font-size: 13px;">
            <span style="color: #3f3f46;">{{c.name}}</span>
            <span style="color: #71717a;">{{c.count}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title" style="display: flex; align-items: center; gap: 6px;">Average attempts to pass<span title="Tries needed to pass, counting only students who passed." style="display: flex; cursor: help;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span></span></div>
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{attempts}}" as="a" hint-placeholder-count="4">
          <div style="display: flex; justify-content: space-between; font-size: 13px;">
            <span style="color: #3f3f46;">{{a.step}}</span>
            <span style="color: #71717a;">{{a.value}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- The roster loses its columns: each student is a block. -->
    <sc-if value="{{onReading}}" hint-placeholder-val="{{false}}">
      <div class="card">
        <div class="card-head"><span class="card-title">Students</span><span class="muted">5</span></div>
        <sc-for list="{{roster}}" as="r" hint-placeholder-count="3">
          <div style="display: grid; grid-template-columns: 1fr 14px; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid {{r.divider}};">
            <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0;">
              <span style="font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                {{r.name}}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display: {{r.flag}};"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><path d="M4 22v-7"></path></svg>
              </span>
              <div style="display: flex; gap: 3px;">
                <span class="step" style="background: {{r.step1}};"></span>
                <span class="step" style="background: {{r.step2}};"></span>
                <span class="step" style="background: {{r.step3}};"></span>
                <span class="step" style="background: {{r.step4}};"></span>
              </div>
              <span style="font-size: 12px; color: {{r.statusColor}};">{{r.line}}</span>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: {{r.chevron}};"><path d="M9 18l6-6-6-6"></path></svg>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <!-- On the class page the readings card is what leads to a roster. -->
    <sc-if value="{{onClass}}" hint-placeholder-val="{{true}}">
      <div class="card">
        <div class="card-head" style="padding: 8px 14px;">
          <span class="card-title" style="display: flex; align-items: center; gap: 8px;">
            Readings<span class="muted" style="font-weight: 400;">2</span>
          </span>
          <button class="btn btn-accent" title="Upload a reading" style="display: inline-flex; align-items: center; justify-content: center; padding: 0; width: 28px; height: 28px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg></button>
        </div>
        <sc-for list="{{readings}}" as="r" hint-placeholder-count="2">
          <div style="display: grid; grid-template-columns: 1fr 14px; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid {{r.divider}};">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 14px; font-weight: 500;">{{r.title}}</span>
              <span style="font-size: 12px; color: #71717a;">{{r.sessions}} sessions</span>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
          </div>
        </sc-for>
      </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#16a34a","section":"Theme"},"state":{"editor":"enum","options":["Class","Reading"],"default":"Class","section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'Class';
    const primary = this.props.primary ?? '#16a34a';
    const onClass = state === 'Class';

    const people = [
      ['Mateo Cruz', 4, 'Completed Sep 18', false],
      ['Bea Villanueva', 1, 'Stopped on Elaborate, Sep 19', true],
      ['Chelsea Ocampo', 0, 'Not started', false],
    ];
    const roster = people.map(([name, passed, line, stopped], i) => {
      const mark = (n) => (n < passed ? (stopped ? '#fecaca' : primary) : '#e4e4e7');
      return {
        name, line,
        step1: mark(0), step2: mark(1), step3: mark(2), step4: mark(3),
        statusColor: stopped ? '#b91c1c' : passed ? '#71717a' : '#a1a1aa',
        flag: stopped ? 'block' : 'none',
        chevron: passed || stopped ? 'block' : 'none',
        divider: i === people.length - 1 ? 'transparent' : '#e4e4e7',
      };
    });

    const readings = [
      { title: 'Strategy', sessions: '17' },
      { title: 'Strategic Vision', sessions: '9' },
    ].map((r, i) => ({ ...r, divider: i === 1 ? 'transparent' : '#e4e4e7' }));

    return {
      primary,
      onClass,
      onReading: !onClass,
      backLabel: onClass ? 'Classes' : 'STRAMA K31',
      title: onClass ? 'STRAMA K31' : 'Strategy',
      subtitle: onClass ? '' : 'Coordinated actions to outperform rivals',
      subtitleDisplay: onClass ? 'none' : 'block',
      scope: onClass
        ? 'Across all readings in this class.'
        : 'For this reading only.',
      passRates: onClass
        ? [
            { step: 'State', pct: '86' },
            { step: 'Elaborate', pct: '71' },
            { step: 'Exemplify', pct: '64' },
            { step: 'Illustrate', pct: '79' },
          ]
        : [
            { step: 'State', pct: '92' },
            { step: 'Elaborate', pct: '68' },
            { step: 'Exemplify', pct: '57' },
            { step: 'Illustrate', pct: '74' },
          ],
      criteria: onClass
        ? [
            { name: 'Completeness', count: '14' },
            { name: 'Explicit Mapping', count: '11' },
            { name: 'Own Words', count: '8' },
          ]
        : [
            { name: 'Contrast', count: '9' },
            { name: 'Explicit Mapping', count: '7' },
            { name: 'Completeness', count: '5' },
          ],
      attempts: onClass
        ? [
            { step: 'State', value: '1.2' },
            { step: 'Elaborate', value: '1.6' },
            { step: 'Exemplify', value: '1.9' },
            { step: 'Illustrate', value: '1.4' },
          ]
        : [
            { step: 'State', value: '1.1' },
            { step: 'Elaborate', value: '1.7' },
            { step: 'Exemplify', value: '2.1' },
            { step: 'Illustrate', value: '1.5' },
          ],
      roster,
      readings,
    };
  }
}
</script>
</body>
</html>
