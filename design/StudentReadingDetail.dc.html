<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #09090b; background: #ffffff; }
    .top { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 24px; border-bottom: 1px solid #e4e4e7; }
    .wrap { max-width: 1148px; margin: 0 auto; padding: 24px 24px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; }
    .crumbs { font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: #52525b; }
    .back { display: none; font-size: 13px; color: #52525b; align-items: center; gap: 4px; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
    .sub { font-size: 14px; color: #71717a; margin-top: 4px; }
    .btn { height: 36px; padding: 0 20px; border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 500; background: #16a34a; color: #ffffff; border: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); flex-shrink: 0; }
    .cols { display: grid; grid-template-columns: 1fr 420px; gap: 32px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .badge { display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 22px; border-radius: 999px; border: 1px solid; font-size: 12px; font-weight: 500; flex-shrink: 0; }
    .ok { border-color: #bbf7d0; color: #15803d; background: #f0fdf4; }
    .bad { border-color: #fecaca; color: #b91c1c; background: #fef2f2; }
    .label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; color: #71717a; }
    .chev { width: 16px; height: 16px; stroke: #a1a1aa; flex-shrink: 0; }
    .box { border: 1px solid #e4e4e7; border-radius: 10px; overflow: hidden; }
    .cc { list-style: none; margin: 0; padding: 4px 20px; }
    .cc li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid #f4f4f5; font-size: 14px; line-height: 1.5; color: #3f3f46; }
    .cc li:first-child { border-top: none; }
    .cc .n { width: 20px; flex-shrink: 0; color: #a1a1aa; font-weight: 500; }
    .srow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #e4e4e7; }
    .srow:first-child { border-top: none; }
    .srow .att { font-size: 14px; font-weight: 500; width: 76px; flex-shrink: 0; }
    .srow .date { margin-left: auto; font-size: 13px; color: #71717a; white-space: nowrap; }
    .empty { padding: 28px 16px; text-align: center; font-size: 14px; color: #71717a; }

    /* tablet: one column, sessions under the core components */
    @media (max-width: 1023px) {
      .wrap { padding: 24px 32px 48px; }
      .cols { grid-template-columns: 1fr; gap: 28px; }
    }
    /* phone: back link instead of the breadcrumb, full-width Start */
    @media (max-width: 639px) {
      .top { padding: 0 16px; }
      .wrap { padding: 16px 16px 32px; gap: 24px; }
      .crumbs { display: none; }
      .back { display: inline-flex; }
      .head { flex-direction: column; align-items: stretch; gap: 16px; }
      h1 { font-size: 22px; }
      .btn { height: 40px; width: 100%; }
      .cc { padding: 2px 16px; }
      .cc li { gap: 10px; }
      .srow { gap: 10px; padding: 12px 14px; }
      .srow .att { width: auto; }
    }
  </style>
</helmet>

<div>
  <div class="top">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="21" height="21" viewBox="0 0 100 100" fill="#16a34a">
        <path d="M32 26 C42 23 58 23 68 26 C58 29 42 29 32 26 Z"></path>
        <path d="M50 70 C38 56 25 46 8 40 C10 42 11 44 12 46 C27 53 40 60 50 78 Z"></path>
        <path d="M50 70 C62 56 75 46 92 40 C90 42 89 44 88 46 C73 53 60 60 50 78 Z"></path>
        <path d="M47 66 C49 64 51 64 53 66 C52 74 51 79 50 86 C49 79 48 74 47 66 Z"></path>
      </svg>
      <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">SEN<span style="color: #16a34a;">SEE-I</span></span>
    </div>
    <div style="width: 28px; height: 28px; border-radius: 999px; background: #f4f4f5; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #71717a;">NT</div>
  </div>

  <div class="wrap">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="crumbs">
        <span>Classes</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        <span>STRAMA K31</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        <span style="color: #09090b;">{{title}}</span>
      </div>
      <div class="back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        STRAMA K31
      </div>
      <div class="head">
        <div>
          <h1>{{title}}</h1>
          <div class="sub">{{desc}}</div>
        </div>
        <button class="btn">Start</button>
      </div>
    </div>

    <div class="cols">
      <div class="col">
        <div class="label">Core components</div>
        <div class="box">
          <ul class="cc">
            <sc-for list="{{components}}" as="c"><li><span class="n">{{c.n}}</span><span>{{c.text}}</span></li></sc-for>
          </ul>
        </div>
      </div>

      <div class="col">
        <div class="label">Past sessions</div>
        <div class="box">
          <sc-if value="{{hasSessions}}">
          <sc-for list="{{sessions}}" as="s"><div class="srow"><span class="att">Attempt {{s.n}}</span><span class="badge {{s.cls}}">{{s.label}}</span><span class="date">{{s.date}}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div></sc-for>
          </sc-if>
          <sc-if value="{{noSessions}}">
          <div class="empty">No attempts yet</div>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"variant":{"editor":"select","options":["long","new"],"default":"long"}}'>
class Component extends DCLogic {
  renderVals() {
    const isNew = (this.props.variant ?? 'long') === 'new';
    const longList = [
      'A business model explains how a company will create value for customers and earn a profit doing so.',
      'The customer value proposition is the set of needs the company sets out to meet, and at what price.',
      'The profit formula links revenue to costs to show how the company will make money.',
      'Revenue depends on the price charged and how many customers buy.',
      'Costs include everything needed to deliver the value proposition, from materials to staff.',
      'A strong model makes the value delivered to customers worth more than the price they pay.',
      'Two companies in the same industry can succeed with very different business models.',
      'A business model should be revisited when customers, rivals or costs change.',
    ];
    const tennis = [
      'After each shot, a player moves back to the middle of the angle the opponent can hit into.',
      'That middle line is the bisector, and it is rarely the centre mark of the court.',
      'Standing on it leaves the same distance to cover on both sides.',
    ];
    const sessions = [
      { n: 6, cls: 'ok', label: 'Complete', date: 'Nov 24, 2026' },
      { n: 5, cls: 'bad', label: 'Failed', date: 'Nov 22, 2026' },
      { n: 4, cls: 'bad', label: 'Failed', date: 'Nov 20, 2026' },
      { n: 3, cls: 'ok', label: 'Complete', date: 'Nov 18, 2026' },
      { n: 2, cls: 'bad', label: 'Failed', date: 'Nov 15, 2026' },
      { n: 1, cls: 'bad', label: 'Failed', date: 'Nov 13, 2026' },
    ];
    return {
      title: isNew ? 'Recovery to the Bisector' : 'Business Model',
      desc: isNew ? 'Where to stand between shots in tennis' : 'Customer value proposition, profit formula',
      components: (isNew ? tennis : longList).map((text, i) => ({ n: i + 1, text })),
      sessions: isNew ? [] : sessions,
      hasSessions: !isNew,
      noSessions: isNew,
    };
  }
}
</script>
</body>
</html>
