<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #09090b; background: #ffffff; }
    .app { height: 100vh; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 24px; border-bottom: 1px solid #e4e4e7; flex-shrink: 0; }
    .icons { display: flex; gap: 10px; }
    .icons span { width: 32px; height: 32px; border-radius: 999px; background: #f4f4f5; display: block; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .box { max-width: 420px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    p { margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: #52525b; }
    .btns { display: flex; gap: 8px; margin-top: 20px; }
    .btn { height: 36px; padding: 0 16px; border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 500; border: 1px solid transparent; background: #16a34a; color: #ffffff; }
    .btn.sec { background: #ffffff; color: #09090b; border-color: #e4e4e7; }
    @media (max-width: 639px) {
      .top { padding: 0 16px; }
      .box { width: 100%; }
      .btns { flex-direction: column-reverse; width: 100%; }
      .btn { width: 100%; height: 40px; }
    }
  </style>
</helmet>
<div class="app">
  <div class="top">
    <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">SEN<span style="color: #16a34a;">SEE-I</span></span>
    <div class="icons"><span></span><span></span></div>
  </div>
  <div class="main">
    <div class="box">
      <h1>{{title}}</h1>
      <p>{{body}}</p>
      <div class="btns">
        <sc-if value="{{crash}}"><button class="btn sec">Reload page</button></sc-if>
        <button class="btn">Back to classes</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"screen":{"editor":"select","options":["notfound","crash"],"default":"notfound"}}'>
class Component extends DCLogic {
  renderVals() {
    const crash = (this.props.screen ?? 'notfound') === 'crash';
    return {
      crash,
      title: crash ? 'Something went wrong' : 'Page not found',
      body: crash
        ? 'This page ran into a problem. Reload it, or go back to your classes.'
        : "This page doesn't exist. Check the link, or go back to your classes.",
    };
  }
}
</script>
</body>
</html>
