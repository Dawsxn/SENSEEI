<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #09090b; background: #ffffff; }
    /* the instructor's top bar: wordmark, the two sections, the account */
    .top { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 24px; border-bottom: 1px solid #e4e4e7; }
    .brand { display: flex; align-items: center; gap: 32px; height: 56px; }
    .word { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .tabs { display: flex; gap: 24px; height: 56px; }
    .tabs span { display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #71717a; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs span.on { color: #09090b; border-color: #09090b; }
    .tabs2 { display: none; }
    .avatar { width: 32px; height: 32px; border-radius: 999px; background: #f4f4f5; }

    .wrap { max-width: 1148px; margin: 0 auto; padding: 32px 24px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; }
    .head { display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
    .btn { height: 32px; padding: 0 12px; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; }
    .btn.primary { background: #16a34a; border-color: #16a34a; color: #ffffff; }
    .btn.muted { opacity: 0.5; }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .card { border: 1px solid #e4e4e7; border-radius: 10px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .band { height: 96px; margin: 8px 8px 0; border-radius: 6px; position: relative; }
    .more { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; }
    .body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
    .name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .sec { font-size: 13px; font-weight: 500; color: #52525b; margin-top: 2px; }
    .meta { font-size: 13px; color: #71717a; }
    .flagpill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; font-size: 12px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .notice { border: 1px dashed #e4e4e7; border-radius: 10px; padding: 40px 16px; text-align: center; font-size: 14px; color: #71717a; }
    .sk { background: #f4f4f5; border-radius: 6px; }
    .nothing { display: none; }
    .flagpill { align-self: flex-start; }

    /* New class */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .dlg { width: 100%; max-width: 440px; background: #ffffff; border-radius: 10px; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.18); box-sizing: border-box; }
    .dlg h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .fields { display: grid; grid-template-columns: 1fr 140px; gap: 12px; margin-top: 16px; }
    .fields label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .input { height: 36px; border: 1px solid #e4e4e7; border-radius: 6px; padding: 0 10px; display: flex; align-items: center; font-size: 14px; }
    .input.focus { box-shadow: 0 0 0 2px rgba(22,163,74,0.3); border-color: #16a34a; }
    .hint { margin-top: 10px; font-size: 13px; color: #71717a; min-height: 18px; }
    .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    @media (max-width: 1023px) {
      .wrap { padding: 28px 32px 40px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }
    @media (max-width: 639px) {
      .top { padding: 0 16px; }
      .tabs { display: none; }
      .tabs2 { display: flex; gap: 24px; height: 48px; padding: 0 16px; border-bottom: 1px solid #e4e4e7; }
      .tabs2 span { display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #71717a; border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tabs2 span.on { color: #09090b; border-color: #09090b; }
      .wrap { padding: 20px 16px 32px; gap: 16px; }
      h1 { font-size: 22px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .band { height: 56px; }
      .scrim { align-items: flex-end; padding: 0; }
      .dlg { max-width: none; border-radius: 14px 14px 0 0; }
      .fields { grid-template-columns: 1fr 110px; }
      .acts .btn { height: 36px; flex: 1; }
    }
  </style>
</helmet>
<div>
  <div class="top">
    <div class="brand">
      <span class="word">SEN<span style="color: #16a34a;">SEE-I</span></span>
      <div class="tabs"><span class="on">Classes</span><span>Readings</span></div>
    </div>
    <span class="avatar"></span>
  </div>
  <div class="tabs2"><span class="on">Classes</span><span>Readings</span></div>

  <div class="wrap">
    <div class="head">
      <h1>Classes</h1>
      <button class="btn">+ New class</button>
    </div>

    <sc-if value="{{cards}}">
    <div class="grid">
      <sc-for list="{{rows}}" as="c">
      <div class="card">
        <div class="band" style="background: {{c.colour}};"><div class="more"><svg width="16" height="16" viewBox="0 0 24 24" fill="#3f3f46"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div></div>
        <div class="body">
          <div><div class="name">{{c.name}}</div><div class="sec">{{c.section}}</div></div>
          <span class="meta">{{c.meta}}</span>
        </div>
      </div>
      </sc-for>
    </div>
    </sc-if>

    <sc-if value="{{empty}}"><div class="notice">No classes available</div></sc-if>

    <sc-if value="{{loading}}">
    <div class="grid">
      <div class="card"><div class="band sk"></div><div class="body"><div class="sk" style="height: 16px; width: 112px;"></div><div class="sk" style="height: 14px; width: 48px;"></div><div class="sk" style="height: 14px; width: 132px;"></div></div></div>
      <div class="card"><div class="band sk"></div><div class="body"><div class="sk" style="height: 16px; width: 112px;"></div><div class="sk" style="height: 14px; width: 48px;"></div><div class="sk" style="height: 14px; width: 132px;"></div></div></div>
    </div>
    </sc-if>
  </div>

  <sc-if value="{{dialog}}">
  <div class="scrim">
    <div class="dlg">
      <h2>New class</h2>
      <div class="fields">
        <div><label>Name</label><div class="input focus">{{typedName}}</div></div>
        <div><label>Section</label><div class="input">{{typedSection}}</div></div>
      </div>
      <div class="acts"><button class="btn">Cancel</button><button class="btn primary {{createMuted}}">Create class</button></div>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"screen":{"editor":"select","options":["list","empty","loading","new-empty","new-typed"],"default":"list"}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.screen ?? 'list';
    const typed = s === 'new-typed';
    return {
      cards: s === 'list' || s.startsWith('new'),
      empty: s === 'empty',
      loading: s === 'loading',
      dialog: s.startsWith('new'),
      typedName: typed ? 'STRAMA' : '',
      typedSection: typed ? 'K32' : '',
      createMuted: typed ? '' : 'muted',
      rows: [
        { name: 'STRAMA', section: 'K31', colour: '#86efac', meta: '3 students &middot; 2 readings', flagCls: 'flagpill', flags: '1 flagged' },
        { name: 'STSWENG', section: 'S11', colour: '#93c5fd', meta: '3 students &middot; 2 readings', flagCls: 'nothing', flags: '' },
      ],
    };
  }
}
</script>
</body>
</html>
