<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: {{primary}}; text-decoration: none; }
    a:hover { color: #15803d; }
    .lbl { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #a1a1aa; }
    .cap { font-size: 12px; color: #71717a; }
  </style>
</helmet>
<div style="width: 1240px; height: 800px; background: #ffffff; color: #09090b; padding: 40px 44px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; align-items: baseline; gap: 12px;">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em;">Direction A2</h1>
    <span class="cap">Rough brush and asymmetry applied. The book is still not reading.</span>
  </div>

  <div style="display: flex; gap: 40px;">

    <div style="width: 280px; height: 280px; border: 1px solid #e4e4e7; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="190" height="190" viewBox="0 0 100 100" fill="{{primary}}">
        <path d="{{p1}}"></path>
        <path d="{{p2}}"></path>
        <path fill-rule="evenodd" d="{{p3g}}"></path>
        <path fill-rule="evenodd" d="{{p4g}}"></path>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; justify-content: center;">
      <span class="lbl">Honest assessment</span>
      <div style="display: flex; flex-direction: column; gap: 11px; max-width: 470px;">
        <sc-for list="{{notes}}" as="c" hint-placeholder-count="4">
          <div style="display: flex; gap: 11px; align-items: flex-start;">
            <div style="width: 4px; height: 4px; border-radius: 999px; background: {{c.dot}}; margin-top: 8px; flex-shrink: 0;"></div>
            <span style="font-size: 13px; line-height: 1.6; color: #3f3f46;">{{c.t}}</span>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="height: 1px; background: #e4e4e7;"></div>

  <div style="display: flex; gap: 48px;">

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <span class="lbl">At size</span>
      <div style="display: flex; align-items: flex-end; gap: 26px;">
        <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 100 100" fill="{{primary}}">
              <path d="{{p1}}"></path>
              <path d="{{p2}}"></path>
              <path d="{{p3}}"></path>
              <path d="{{p4}}"></path>
            </svg>
            <span style="font-size: 11px; color: #a1a1aa;">{{s.px}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <span class="lbl">Contained</span>
      <div style="display: flex; align-items: flex-end; gap: 20px;">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <div style="width: {{t.box}}px; height: {{t.box}}px; background: {{primary}}; border-radius: {{t.r}}px; display: flex; align-items: center; justify-content: center;">
              <svg width="{{t.glyph}}" height="{{t.glyph}}" viewBox="0 0 100 100" fill="#ffffff">
                <path d="{{p1}}"></path>
                <path d="{{p2}}"></path>
                <path d="{{p3}}"></path>
                <path d="{{p4}}"></path>
              </svg>
            </div>
            <span style="font-size: 11px; color: #a1a1aa;">{{t.box}}</span>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="height: 1px; background: #e4e4e7;"></div>

  <div style="display: flex; gap: 56px; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <span class="lbl">Lockup</span>
      <div style="display: flex; align-items: center; gap: 13px;">
        <svg width="44" height="44" viewBox="0 0 100 100" fill="{{primary}}">
          <path d="{{p1}}"></path>
          <path d="{{p2}}"></path>
          <path d="{{p3}}"></path>
          <path d="{{p4}}"></path>
        </svg>
        <span style="font-size: 27px; font-weight: 600; letter-spacing: -0.03em;">SEN<span style="color: {{primary}};">SEE-I</span></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">
      <span class="lbl">Reversed</span>
      <div style="background: #09090b; border-radius: 10px; padding: 22px 28px; display: flex; align-items: center; gap: 13px;">
        <svg width="44" height="44" viewBox="0 0 100 100" fill="#ffffff">
          <path d="{{p1}}"></path>
          <path d="{{p2}}"></path>
          <path d="{{p3}}"></path>
          <path d="{{p4}}"></path>
        </svg>
        <span style="font-size: 27px; font-weight: 600; letter-spacing: -0.03em; color: #ffffff;">SENSEE-I</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#16a34a","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const p1 = 'M55 26 L63 22 L72 19 L79 18 L74 22 L66 26 L58 29 Z';
    const p2 = 'M47 41 L53 41 L53 66 L50 71 L47 66 Z';
    const p3 = 'M50 46 L40 44 L28 43 L18 42 L17 52 L17 62 L28 63 L39 64 L50 66 Z';
    const p4 = 'M50 46 L60 44 L72 43 L83 42 L84 52 L83 62 L72 63 L61 64 L50 66 Z';
    return {
      primary: this.props.primary ?? '#16a34a',
      p1, p2, p3, p4,
      p3g: p3 + ' M23 49 L34 50 L44 52 L43 55 L33 53 L22 52 Z',
      p4g: p4 + ' M79 49 L69 51 L59 53 L60 56 L70 54 L80 52 Z',
      notes: [
        { dot: '#b91c1c', t: 'This does not read as a book. Four rebuilds, and it lands somewhere between a bird, a moth and a mask. The bristle gaps read as eyes.' },
        { dot: '#b91c1c', t: 'The cause is structural, not a matter of tuning. A filled open book with no hand or body holding it is ambiguous at any weight. Book icons that work are usually outlines, not solid fills.' },
        { dot: '#71717a', t: 'Note that B2 contains the clearest book of anything here, and that is because the figure gives it context.' },
        { dot: '#71717a', t: 'Three ways out are listed in the reply. I would not keep tuning this one.' }
      ],
      sizes: [{ px: 64 }, { px: 40 }, { px: 24 }, { px: 16 }],
      tiles: [
        { box: 64, r: 14, glyph: 42 },
        { box: 32, r: 8,  glyph: 22 },
        { box: 16, r: 4,  glyph: 11 }
      ]
    };
  }
}
</script>
</body>
</html>
