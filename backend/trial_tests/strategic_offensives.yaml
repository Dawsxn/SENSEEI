# The pre-test and post-test for the strategic offensives reading (Chapter 6,
# pp. 109-110), taken in the trial app (docs/context/trial.md).
#
# A class takes this test when its "Pre-test and post-test" setting names it, and
# that setting is only offered for a class whose reading is titled exactly
# `reading_title`. Times are per participant, from when each test starts.
#
# Every question is about the general concept, the reading's two core
# components: what a strategic offensive is (an aggressive move to gain
# profitable market share at rivals' expense, or to whittle away at a strong
# rival's advantage) and how to choose one (grounded in the company's own
# strengths, aimed at rivals' weaknesses). The full answer key, with why each
# question is built the way it is, is kept with the thesis documents.
#
# Kinds:
# - `truefalse`: a set of statements, each answered True or False and scored
#   1 point when right. A statement left blank scores 0.
# - `text`: a written answer, scored by the grader against `criteria` (the
#   highest key is its points).
# - `steps`: a written answer in parts, one score for the whole, graded like
#   `text`. With `lock_first`, the first part becomes read-only once a later
#   part has text.
# Parts A to C end with "Is this answer fully correct?", which calibration uses:
# "Yes, I'm sure" matches only full marks.
#
# Editing this file changes the test, so it only changes before the first
# sitting: nothing is released between sittings.

key: strategic_offensives
reading_title: Strategic Offensives
pretest_minutes: 5
posttest_minutes: 30
# A line shown at the start of a part, under its heading.
part_intros:
  A: For each statement, choose True or False.
pretest:
  question: Define what a strategic offensive is, to the best of your ability.
  reference: An aggressive move to gain market share or an advantage at rivals' expense, built on the
    company's own strengths and aimed at rivals' weaknesses.
  criteria:
    3: Complete and accurate.
    2: Mostly correct, with something missing.
    1: Partly correct but vague or missing most of the idea.
    0: No answer, or the definition is wrong.
posttest:
# --------------------------------------------------------------------------- #
# Part A: facts and procedures
- id: q1
  part: A
  dimension: facts
  kind: truefalse
  question: Which of these are true of a strategic offensive?
  statements:
    a:
      text: An offensive must take something from rivals, either market share or part of their advantage.
      answer: true
    b:
      text: A company that grows only by selling to people who have never bought from any rival is carrying
        out an offensive.
      answer: false
      why: Any growth is an offensive. No rival loses anything.
    c:
      text: An offensive can be a series of small attacks rather than one big one.
      answer: true
      why: Offensives must be big. Small, repeated attacks can wear a rival down.
    d:
      text: Lowering prices to stop a company's own customers from leaving for a rival is an offensive move.
      answer: false
      why: Defending is an offensive. This holds ground; it takes nothing from the rival.
    e:
      text: An offensive is meant to gain ground rather than to hold it.
      answer: true
- id: q2
  part: A
  dimension: facts
  kind: truefalse
  question: Which statements about the goal of a strategic offensive are correct?
  statements:
    a:
      text: Market share won by selling at a loss does not meet the goal of an offensive.
      answer: true
      why: The share must be profitable. A student who holds only "market share" marks this false.
    b:
      text: The goal of an offensive is to win as much market share as possible.
      answer: false
      why: Share at any cost. It drops "profitable".
    c:
      text: An offensive can aim to wear down a strong rival's advantage rather than win share right away.
      answer: true
    d:
      text: The goal of an offensive is to protect the company's current market share from rivals.
      answer: false
      why: Defending is an offensive. Protecting share keeps the company where it is.
    e:
      text: An offensive that brings in more customers than before has met its goal.
      answer: false
      why: More customers means success. It ignores where they came from and whether they are profitable.
- id: q3
  part: A
  dimension: procedures
  kind: truefalse
  question: A company is deciding what to base an offensive on. Which of these are sound ways to decide?
  statements:
    a:
      text: An offensive should target the area where the rival is strongest.
      answer: false
      why: Attack the rival's strength. The rule says to aim at its weaknesses.
    b:
      text: Copying what the market leader does well is a good basis for an offensive.
      answer: false
      why: Copy the leader. That builds on the leader's strength, not the company's.
    c:
      text: The company should use one of its strong points against one of its rival's weak points.
      answer: true
    d:
      text: Knowing where the rival is weak is sufficient to choose an offensive's target.
      answer: false
      why: Half the rule. The rival's weakness without the company's strength.
    e:
      text: A company whose costs are higher than its rivals' should try to win customers by charging less
        than its rivals.
      answer: false
      why: Attacking with a weakness. Low prices need low costs; the reading calls this foolish.
# --------------------------------------------------------------------------- #
# Part B: connections
- id: q4
  part: B
  dimension: connections
  kind: text
  question: A company is deciding whether to base its offensive on something it does well or something
    it does not do well. How could this choice affect the result of the offensive? Explain why.
  goal: Connect what an offensive is based on to whether it reaches its goal. The student has to supply
    the goal (profitable share won from rivals) themselves.
  reference: Basing it on something the company does well lets it win customers at a cost it can sustain,
    with an edge rivals can't easily match, so the market share it takes from rivals is profitable and
    lasts. Basing it on something it does not do well means spending more to win less. Rivals can answer
    easily, so any share it wins is costly, hard to keep, or not profitable, and the offensive falls short
    of its goal. A full answer judges the result against the goal (profitable share won from rivals, or
    wearing down a rival's advantage), not just "more customers".
  criteria:
    3: Gets the direction right and judges the result against the goal (profitable share won from rivals,
      or wearing down a rival's advantage), explaining why one choice reaches it and the other doesn't.
    2: Gets the direction right with a reason, but the result is only "more customers", "more share" or
      "success", with profitability or rivals missing. Or names the goal but explains only one side.
    1: Gets the direction right with no reason ("doing what it's good at works better").
    0: Wrong direction, no answer, or says the choice doesn't matter.
- id: q5
  part: B
  dimension: connections
  kind: text
  question: Continuous product innovation means regularly bringing out new or improved products to draw
    customers away from rivals. For what kind of company, facing what kind of rivals, would this offensive
    work well? Explain why.
  goal: Connect one of the reading's strategies to the rule for choosing an offensive (own strengths
    against rivals' weaknesses).
  reference: A company that is good at developing new products quickly, facing rivals that are slow or
    weak at it. The company attacks with its strength, and the rivals can't keep up because that is their
    weakness, so it draws customers away from them. Against rivals that innovate just as well, each new
    product is matched and the offensive gains little. (The reading says this strategy works "especially
    when rivals' new product development capabilities are weak".)
  criteria:
    3: Names both (the company is strong at product development and the rivals are weak or slow at it)
      and explains why that pairing makes the offensive work.
    2: Names both but doesn't explain why the pairing matters, or explains one side well and the other
      vaguely.
    1: Names only one side (the company or the rivals), or describes the strategy again.
    0: No answer, or a wrong pairing (for example, rivals that are strong at innovation).
# --------------------------------------------------------------------------- #
# Part C: transfer
- id: q6
  part: C
  dimension: transfer
  kind: text
  question: |-
    A small milk tea shop near a university competes with a large chain that has most of the students as customers. Both sell a cup of milk tea for ₱100. It costs the shop ₱40 to make a cup, while it costs the chain ₱60. Two of the shop's managers each propose cutting prices by 20%.

    Paolo wants to cut prices so that students who usually buy from the chain start buying from the shop instead.

    Tony wants to cut prices because he wants to make sure none of the shop's regular customers move to the chain.

    Paolo and Tony each call their proposal a strategic offensive. Who is right: Paolo, Tony, both, or neither? Explain your answer.
  goal: Apply what an offensive is (gaining ground at rivals' expense) to two identical actions with
    different purposes.
  reference: Only Paolo. His price cut aims to take the chain's customers, which is gaining ground at a
    rival's expense. Tony's only keeps customers the shop already has, which is defending, not attacking,
    and takes nothing from the chain. The action is the same, so only the purpose tells them apart.
  criteria:
    3: Paolo only, because his cut takes customers from the rival, and Tony's is defending what the shop
      already has.
    2: Paolo only, with half of that (for example, "Paolo is attacking") without saying why Tony's isn't
      an offensive.
    1: Paolo with no clear reason, or "both" while noticing their purposes differ.
    0: Tony, both, or neither.
- id: q7
  part: C
  dimension: transfer
  kind: text
  question: |-
    A regional bus company is planning a strategic offensive against its main rival, a national bus line. The regional company's buses are newer and more comfortable, and its drivers are known for being on time. On the other hand, the national line has many more routes and the lowest fares in the country, but its buses are old and often late. The national line's fares are lower than what a trip costs the regional company to run.

    Mariel, a manager at the regional company, wants to add more routes and lower fares to match the national line, because that is what has made the national line so popular.

    Dawson, another manager, wants to spend the budget on advertising the company's comfortable buses and on-time trips.

    Whose plan is a sound strategic offensive: Dawson's, Mariel's, both, or neither? Explain your answer for each plan.
  goal: Apply the rule for choosing an offensive (own strengths against rivals' weaknesses) and the need
    for profitable share to two competing plans.
  reference: Dawson's. His plan attacks with the company's strengths (comfort, punctuality) where the
    national line is weak (old buses, delays). Mariel's plan attacks where the national line is strongest
    (routes and fares), and since the national line's fares are below the regional company's cost per
    trip, matching them means losing money on every trip, and more routes means more losses. The share it
    wins isn't profitable.
  criteria:
    3: Dawson, explaining that his plan uses the company's strengths against the rival's weaknesses, and
      what is wrong with Mariel's (it attacks the rival's strengths, or the share wouldn't be profitable).
    2: Dawson, with one of those two explanations.
    1: Dawson with a vague reason ("better marketing", "it's cheaper"), or "combine both plans" without
      saying the fare-matching half is the weak one.
    0: Mariel, both, or neither, or no reason.
# --------------------------------------------------------------------------- #
# Part D: metacognition
- id: q8
  part: D
  dimension: metacognition
  kind: steps
  lock_first: true
  question: Build your own checklist, use it on a case, and check how it did.
  steps:
    a: Write your own checklist of 2 to 4 questions that someone could ask to decide whether a move is a
      well-chosen strategic offensive. Part (a) is not scored on its own. Once you start part (b), you
      can't change part (a), so make sure your checklist is final first. If it needs fixing, say so in
      part (c).
    b: 'Use your checklist on this case: A coffee chain opens 30 branches in a province where no other
      coffee company operates or plans to. Its customers there are people who never bought coffee from
      anyone before. Its CEO calls it "our biggest strategic offensive ever." Is the CEO right?'
    c: Did your checklist lead you to the right answer? If not, or if it was hard to apply, how would you
      change it?
  goal: Build a structure of their own (a checklist), test it on a case chosen to break a weak one, and
    revise it. One score for the whole, decided mostly by (c), with (a) and (b) as the evidence.
  reference: 'The CEO is wrong. It is not an offensive: no rival loses customers or an advantage, since no
    other coffee company operates there, so it is expansion. A good checklist asks "Does a rival lose
    customers or an advantage?", "Is it based on our strengths?", "Is it aimed at a rival''s weakness?" and
    "Will the share be profitable?" A checklist without the first question accepts the case, and the
    student should notice and add it. Score the final verdict: a weak checklist that gets (b) wrong, caught
    and fixed in (c), earns full marks.'
  criteria:
    3: Ends with the right verdict for the right reason (no rival loses anything), and either their
      checklist caught it and they say how, or it didn't and they find and fix the gap. A wrong (b)
      corrected in (c) belongs here.
    2: Ends with the right verdict for the right reason, but doesn't connect it to their checklist, or
      notices a gap without fixing it.
    1: Right verdict with no reason, or a wrong verdict while sensing their checklist is missing something.
    0: Ends with "it is an offensive" and no reflection.
