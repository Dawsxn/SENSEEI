# Render Blueprint: the trial instance, used for the study and nothing else
# (docs/context/trial.md).
#
# A file of its own, not part of render.yaml, so it costs nothing until someone
# chooses to create it: in the Render dashboard, New > Blueprint, pick this
# repository, and set the Blueprint file to `render-trial.yaml`. Render then
# asks for every value marked `sync: false`.
#
# Paid plans, because the trial cannot sleep mid-sitting or lose its database
# after 30 days, as the free ones do. Delete both when the export is safe.
#
# Deploys every release to `main`, and only those. `main` changes only through a
# release, so the rule that keeps the app the same for every participant is a
# release rule: release what the dry run finds, then nothing from the first
# sitting until the last is done.

databases:
  - name: senseei-trial-db
    databaseName: senseei
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: senseei-trial
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: senseei-trial-db
          property: connectionString
      - key: TRIAL_MODE
        value: "true"
      # Production rules: the dev sign-in picker and QA switching cannot exist
      # here, whatever else is set, so no one can act as a participant.
      - key: ENVIRONMENT
        value: production
      - key: AUTH_DEV_BYPASS
        value: "false"
      # An empty database stays empty. The trial holds participants only.
      - key: SEED_IF_EMPTY
        value: "false"
      # The model the trial runs, exactly as the Assessment Agent eval measured
      # it (assessment-agent-eval/results_log.csv: prompt v7, rubric v3,
      # deepseek-flash, temperature 0, 8192 output tokens). In this file, not
      # the dashboard, so it changes only through a release. To switch back to
      # Gemini: LLM_PROVIDER gemini, LLM_MODEL gemini-3.1-pro-preview, LLM_BASE_URL
      # blank, LLM_API_KEY_ENV GEMINI_API_KEY (docs/context/tech-stack.md).
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_MODEL
        value: deepseek-flash
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_API_KEY_ENV
        value: DEEPSEEK_API_KEY
      - key: LLM_TEMPERATURE
        value: "0"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "8192"
      - key: ASSESSMENT_PROMPT_VERSION
        value: v7
      - key: RUBRIC_VERSION
        value: v3
      # The chatbot group may search the web, as a typical chatbot can. Its
      # citations are never shown; the searches are in the export.
      - key: CHATBOT_WEB_SEARCH
        value: "true"
      # DeepSeek cannot read a PDF, so the upload's figure step stays on Gemini.
      - key: FIGURE_PROVIDER
        value: gemini
      - key: FIGURE_MODEL
        value: gemini-3.1-pro-preview
      - key: FIGURE_API_KEY_ENV
        value: GEMINI_API_KEY
      - key: SESSION_SECRET
        generateValue: true
      # Entered in the dashboard. Never in this file.
      - key: APP_BASE_URL          # https://senseei-trial.onrender.com, or whatever Render assigns
        sync: false
      - key: GRADER_EMAILS         # the grader, who sees only the grading page
        sync: false
      - key: GOOGLE_CLIENT_ID      # the research team signs in with Google
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: INSTRUCTOR_EMAILS     # the research team, and no one else
        sync: false
      - key: GEMINI_API_KEY        # a paid-tier key, so answers are not used for training
        sync: false
      - key: DEEPSEEK_API_KEY      # for LLM_PROVIDER openai_compat at https://api.deepseek.com
        sync: false
