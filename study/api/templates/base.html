<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SENSEE-I trial{% endblock %}</title>
<style>
  :root {
    --bg: #fbfaf8;
    --panel: #ffffff;
    --ink: #1c1a17;
    --muted: #6b6560;
    --line: #e4e0da;
    --accent: #2f5d50;
    --accent-soft: #eef3f1;
    --warn: #8a4b1f;
    --warn-soft: #fdf2e7;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #201e1b; --ink: #f0ece6; --muted: #a49c94;
      --line: #34302b; --accent: #7fb8a5; --accent-soft: #22302c;
      --warn: #e0a068; --warn-soft: #302419;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    border-bottom: 1px solid var(--line); background: var(--panel);
    padding: .7rem 1.2rem; display: flex; gap: 1rem; align-items: baseline;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: .01em; }
  header .meta { color: var(--muted); font-size: .82rem; }
  main { max-width: 1080px; margin: 0 auto; padding: 1.4rem 1.2rem 3rem; }
  .wide { max-width: 1500px; }
  h2 { font-size: 1.15rem; margin: 0 0 .6rem; }
  h3 { font-size: .95rem; margin: 1.4rem 0 .5rem; }
  p { margin: 0 0 .8rem; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1.1rem 1.2rem; margin-bottom: 1.1rem;
  }
  .notice {
    background: var(--warn-soft); border: 1px solid var(--warn);
    color: var(--warn); border-radius: var(--radius);
    padding: .7rem .9rem; margin-bottom: .9rem; font-size: .88rem;
  }
  .pill {
    display: inline-block; padding: .12rem .5rem; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent);
    font-size: .75rem; font-weight: 600; letter-spacing: .02em;
  }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .78rem;
       text-transform: uppercase; letter-spacing: .04em; }
  td.num { font-variant-numeric: tabular-nums; }
  input[type=text], textarea, input[type=number] {
    width: 100%; padding: .5rem .6rem; border: 1px solid var(--line);
    border-radius: 7px; background: var(--bg); color: var(--ink);
    font: inherit;
  }
  textarea { resize: vertical; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: .5rem .95rem; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: .6rem; align-items: flex-end; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  .row > .shrink { flex: 0 0 auto; }
  code { font-size: .85em; background: var(--accent-soft); padding: .1rem .3rem;
         border-radius: 4px; }
  .timer {
    font-variant-numeric: tabular-nums; font-weight: 700;
    font-size: 1.05rem; color: var(--accent);
  }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
  @media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
  .scroller { max-height: 62vh; overflow-y: auto; }
  .reading { white-space: pre-wrap; line-height: 1.7; }
  .chat { display: flex; flex-direction: column; gap: .7rem; }
  .bubble { padding: .6rem .8rem; border-radius: 10px; max-width: 90%;
            white-space: pre-wrap; font-size: .92rem; }
  .bubble.you { align-self: flex-end; background: var(--accent-soft); }
  .bubble.model { align-self: flex-start; border: 1px solid var(--line); }
  .bubble.failed { align-self: flex-start; background: var(--warn-soft);
                   color: var(--warn); border: 1px solid var(--warn); }
</style>
</head>
<body>
<header>
  <h1>{% block heading %}SENSEE-I trial harness{% endblock %}</h1>
  <span class="meta">{% block subheading %}{% endblock %}</span>
</header>
<main class="{% block mainclass %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
